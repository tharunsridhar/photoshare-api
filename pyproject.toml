

[project]
name = "photoshare-api"
version = "0.1.0"
description = "Photo/video sharing API - FastAPI, async SQLAlchemy, PostgreSQL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18",
    "celery>=5.4",
    "fastapi>=0.141.1",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "imagekitio<5",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.14",
    "python-dotenv>=1.2.2",
    "redis>=5.0",
    "uvicorn[standard]>=0.52.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # FastAPI's Depends()/File()/Form() in argument defaults is the idiomatic pattern, not a bug
]
