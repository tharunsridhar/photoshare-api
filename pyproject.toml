[project]
name = "photoshare-django"
version = "0.1.0"
description = "Django/DRF port of PhotoShare"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.4",
    "dj-database-url>=2.2",
    "django>=5.0,<5.1",
    "django-cors-headers>=4.4",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "gunicorn>=23.0",
    "imagekitio>=4.0,<5.0",  # 5.x is a rewritten SDK with a different API shape
    "psycopg[binary]>=3.2",
    "pyjwt>=2.9",
    "python-dotenv>=1.0",
    "redis>=5.0",
    "whitenoise>=6.7",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "requests>=2.32",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 160
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # DRF/Django patterns occasionally look like this; not a bug here
]
