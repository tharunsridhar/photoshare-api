services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-photoshare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-photoshare}
      POSTGRES_DB: ${POSTGRES_DB:-photoshare}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-photoshare} -d ${POSTGRES_DB:-photoshare}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overrides whatever's in .env (that's for running directly on the
      # host) - inside the compose network, services are reachable by name,
      # not localhost.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-photoshare}:${POSTGRES_PASSWORD:-photoshare}@postgres:5432/${POSTGRES_DB:-photoshare}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-photoshare}:${POSTGRES_PASSWORD:-photoshare}@postgres:5432/${POSTGRES_DB:-photoshare}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    # skip the api image's entrypoint (it runs migrations + uvicorn) - the
    # worker doesn't serve HTTP and shouldn't race the api container to run
    # migrations twice
    entrypoint: []
    command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=info"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
